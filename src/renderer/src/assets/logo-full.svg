<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1300" viewBox="0 0 1024 1300">
  <!-- Full kobiPDF logo: the mark with the wordmark underneath. -->
  <g transform="translate(112 0) scale(0.78)">
  <!-- kobiPDF mark: page with a red PDF badge, a navy pen and a red signature stroke. Transparent background. -->
  <!-- Page -->
  <path d="M300 120 H620 L800 300 V840 Q800 900 740 900 H300 Q240 900 240 840 V180 Q240 120 300 120 Z"
        fill="#f7f8fb" stroke="#1f2b45" stroke-width="40" stroke-linejoin="round"/>
  <!-- Folded corner -->
  <path d="M620 120 V250 Q620 300 670 300 H800 Z" fill="#dfe3ec" stroke="#1f2b45" stroke-width="40" stroke-linejoin="round"/>
  <!-- Text lines -->
  <g fill="#9aa1b2">
    <rect x="320" y="220" width="230" height="38" rx="19"/>
    <rect x="320" y="290" width="190" height="38" rx="19"/>
    <rect x="320" y="360" width="230" height="38" rx="19"/>
  </g>
  <!-- PDF badge -->
  <rect x="150" y="440" width="480" height="200" rx="40" fill="#d7141a"/>
  <g fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- P -->
    <path d="M218 600 V480 H278 A38 38 0 0 1 278 556 H218"/>
    <!-- D -->
    <path d="M352 480 V600 H385 A60 60 0 0 0 385 480 Z"/>
    <!-- F -->
    <path d="M502 600 V480 H580 M502 540 H566"/>
  </g>
  <!-- Signature stroke -->
  <path d="M470 790 Q610 708 735 712 Q615 728 470 790 Z" fill="#d7141a"/>
  <!-- Pen, leaning right, tip on the signature -->
  <g transform="translate(738 712) rotate(35)">
    <path d="M0 0 L-30 -78 H30 Z" fill="#1f2b45"/>
    <rect x="-38" y="-104" width="76" height="28" fill="#ffffff" stroke="#1f2b45" stroke-width="10"/>
    <rect x="-42" y="-430" width="84" height="330" rx="18" fill="#1f2b45"/>
    <rect x="-42" y="-385" width="84" height="22" fill="#ffffff" opacity="0.9"/>
    <path d="M-42 -410 Q-42 -470 0 -470 Q42 -470 42 -410 Z" fill="#1f2b45"/>
    <path d="M46 -360 H64 Q76 -360 76 -348 V-250 Q76 -238 64 -238" fill="none" stroke="#7b8396" stroke-width="16" stroke-linecap="round"/>
  </g>
  </g>
  <text x="512" y="1040" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="225" letter-spacing="-4"><tspan fill="#1f2b45">kobi</tspan><tspan fill="#d7141a">PDF</tspan></text>
  <path d="M190 1150 Q520 1065 860 1100 Q520 1095 190 1150 Z" fill="#d7141a"/>
</svg>
