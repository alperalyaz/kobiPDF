appId: com.hidroteknik.kobipdf
productName: kobiPDF
copyright: Copyright © 2026 Hidroteknik

directories:
  buildResources: build
  output: release/${version}

# Reuse the locally installed Electron instead of downloading it again.
electronDist: node_modules/electron/dist

files:
  - out/**
  - package.json

extraResources:
  - from: build/icon.png
    to: icon.png

fileAssociations:
  - ext: pdf
    name: PDF Document
    description: PDF Document
    mimeType: application/pdf
    role: Editor

win:
  executableName: kobiPDF
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: appx
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: kobiPDF
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}

# Microsoft Store package (MSIX). Identity values come from Partner Center >
# kobiPDF > Product identity. The Store signs the package on submission.
appx:
  identityName: Hidroteknik.kobiPDF
  publisher: CN=119D3611-306D-4F5E-B28C-3904B4C07374
  publisherDisplayName: Hidroteknik
  displayName: kobiPDF
  applicationId: kobiPDF
  backgroundColor: transparent
  languages:
    - tr-TR
    - en-US
  artifactName: ${productName}-${version}-Store.${ext}

mac:
  # electron-builder generates icon.icns from the 1024px PNG.
  icon: build/icon.png
  category: public.app-category.productivity
  # Builds for the host architecture, matching the local electronDist.
  target: dmg

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
